<aside 
  class="sticky top-[64px] z-50 flex flex-col h-full bg-white dark:bg-background-dark border-r border-slate-200 dark:border-slate-800 transition-all duration-300 ease-in-out relative shadow-sm"
  [ngClass]="isCollapsed() ? 'w-20' : 'w-72'"
>
  <!-- Toggle Button -->
  <button 
    (click)="toggleSidebar()"
    class="absolute top-8 flex size-6 items-center justify-center rounded-full bg-primary text-white shadow-md hover:scale-110 transition-transform z-10 ltr:-right-3 rtl:-left-3"
  >
    <span class="material-symbols-outlined text-sm">chevron_left
      <!-- {{ isCollapsed() ? (isRtl() ? 'chevron_left' : 'chevron_right') : (isRtl() ? 'chevron_right' : 'chevron_left') }} -->
    </span>
  </button>

  <!-- Sidebar Content -->
  <div class="flex-1 flex flex-col pt-6 overflow-y-auto overflow-x-hidden scrollbar-hide">
    <!-- Menu Items -->
    <nav class="flex-1 px-3 space-y-1">
      @for (item of menuItems; track item.path) {
        <a 
          [routerLink]="item.path"
          routerLinkActive="bg-primary/10 text-primary"
          [routerLinkActiveOptions]="{exact: item.path === 'dashboard'}"
          class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/50 hover:text-primary transition-all group whitespace-nowrap"
          [title]="isCollapsed() ? (item.label | translate) : ''"
        >
          <span class="material-symbols-outlined text-[22px] group-hover:scale-110 transition-transform">
            {{ item.icon }}
          </span>
          <span 
            class="text-sm font-semibold transition-all duration-300"
            [class.opacity-0]="isCollapsed()"
            [class.pointer-events-none]="isCollapsed()"
          >
            {{ item.label | translate }}
          </span>
        </a>
      }
    </nav>
  </div>
</aside>
