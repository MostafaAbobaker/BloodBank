<header
    class=" flex h-16 w-full items-center justify-between border-b border-primary/10 bg-white/80 dark:bg-background-dark/80 px-4 md:px-10 backdrop-blur-md">
    <div class="flex items-center gap-8">
        <a routerLink="/" class="flex items-center gap-3 cursor-pointer">
            <div class="flex size-10 items-center justify-center rounded-lg bg-primary text-white">
                <span class="material-symbols-outlined">bloodtype</span>
            </div>
            <div class="hidden flex-col md:flex">
                <h1 class="text-lg font-bold leading-tight tracking-tight">
                    BloodBank Pro
                </h1>
                <p class="text-[10px] font-medium text-primary uppercase tracking-widest">
                    Medical Management
                </p>
            </div>
        </a>
        <div class="hidden lg:flex items-center gap-6">
            <a class="text-sm font-medium  dark:text-slate-400 hover:text-primary px-1 py-4 transition-colors" routerLink="dashboard" routerLinkActive="font-semibold border-b-2 border-primary text-primary">{{ "navbar.dashboard" | translate }}</a>
            <a class="text-sm font-medium  dark:text-slate-400 hover:text-primary px-1 py-4 transition-colors" routerLink="inventory" routerLinkActive="font-semibold border-b-2 border-primary text-primary">{{ "navbar.inventory" | translate }}</a>
            <a class="text-sm font-medium  dark:text-slate-400 hover:text-primary px-1 py-4 transition-colors" routerLink="donors" routerLinkActive="font-semibold border-b-2 border-primary text-primary">{{ "navbar.donors" | translate }}</a>
            <a class="text-sm font-medium  dark:text-slate-400 hover:text-primary px-1 py-4 transition-colors" routerLink="reports" routerLinkActive="font-semibold border-b-2 border-primary text-primary">{{ "navbar.reports" | translate }}</a>
        </div>
    </div>
    <div class="flex items-center gap-4">
        <div
            class="hidden sm:flex items-center bg-slate-100 dark:bg-slate-800 rounded-lg px-3 py-1.5 gap-2 border border-slate-200 dark:border-slate-700">
            <span class="material-symbols-outlined text-slate-400 text-sm">search</span>
            <input class="bg-transparent border-none text-sm focus:ring-0 w-32 md:w-48 placeholder:text-slate-400 focus-visible:outline-none "
                [placeholder]=" 'navbar.search' | translate" type="text" />
        </div>
        <div class="flex items-center gap-2">
            @if(lang === 'ar') {
                <button (click)="toggleLanguage('en')"
                class="flex size-10 items-center cursor-pointer justify-center rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-primary/10 hover:text-primary transition-all">
                <span class="material-symbols-outlined"></span>
                <span>En</span>
            </button>
            } @else {
                <button (click)="toggleLanguage('ar')"
                class="flex size-10 items-center cursor-pointer justify-center rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-primary/10 hover:text-primary transition-all">
                <span class="material-symbols-outlined"></span>
                <span>Ar</span>
            </button>
            }
            
            <button
                class="relative flex size-10 items-center cursor-pointer justify-center rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-primary/10 hover:text-primary transition-all">
                <span class="material-symbols-outlined">notifications</span>
                <span
                    class="absolute top-2 right-2 size-2 bg-primary rounded-full ring-2 ring-white dark:ring-background-dark"></span>
            </button>
            <div class="h-8 w-px bg-slate-200 dark:bg-slate-700 mx-1"></div>
            <div class="size-10 rounded-full bg-cover bg-center ring-2 ring-primary/20 cursor-pointer"
                data-alt="User profile picture of a doctor" style="
                background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuDuwHcGL9aD-ARYODn5-KJHwcE54fQdzCRpoHekepsxCWEebVaDNxbIx2CXhlWsVglPc59md43tDsfID88DFuDFEeRE0vI_dEUYW_3gb5AjRLNQlHRUbifASXElPVFGAQy2Xr_j20bl8gjBjo5iimQCLu1AU1EpAOqxdFjXpCv35FwLyCtEJih1KnPyjmihXoA-SHbsWhyJmdbyrbRektpOE-UJDDLfRSGqHT6R3ZfltMFeArS9e-gDo11PSp1Hzp13ZsOKYMfmFqcD&quot;);
              "></div>
        </div>
    </div>
</header>
