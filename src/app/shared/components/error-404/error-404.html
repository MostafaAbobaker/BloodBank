<section class="error-404-page">
  <div class="flex rounded-lg flex-col items-center justify-center bg-white p-6 text-center error-404-content">
    <!-- Top Text -->
    <p class="mb-8 text-sm font-bold tracking-[0.2em] text-slate-500 uppercase">Page Not Found</p>
  
    <!-- Illustration Area -->
    <div class="relative mb-12 flex items-center justify-center h-48 w-full max-w-lg">
      <!-- Background Accents (Bricks) -->
      
  
      <!-- Main 404 with Magnifying Glass -->
      <div class="relative flex items-center gap-2 select-none">
        <!-- First 4 -->
        <span class="text-[9rem] font-black text-primary leading-none">4</span>
        <span class="text-[9rem] font-black text-primary leading-none">0</span>
        <span class="text-[9rem] font-black text-primary leading-none">4</span>
      </div>

  </p>

    <button

    </button>

</section>
