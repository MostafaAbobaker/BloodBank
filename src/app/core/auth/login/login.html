<section class="login-page">
  <div class="login-shell">
    <div class="login-card">
      <div class="flex flex-col justify-center px-6 py-8 sm:px-8 lg:px-14 xl:px-20">
        <div class="flex items-center gap-3">
            <div class="flex size-10 items-center justify-center rounded-lg bg-primary text-white">
                <span class="material-symbols-outlined">bloodtype</span>
            </div>
            <div class=" flex-col md:flex">
                <h1 class="text-lg font-bold leading-tight tracking-tight">
                    BloodBank Pro
                </h1>
                <p class="text-[10px] font-medium text-primary uppercase tracking-widest">
                    Medical Management
                </p>
            </div>
        </div>

        <div class="mt-12">
          <h1 class="text-4xl font-bold leading-tight text-slate-900 xl:text-[2.7rem]">Log in</h1>
          <p class="mt-3 text-base text-slate-400">Let's begin your Blood Bank journey.</p>
        </div>

        <form class="mt-9"   (submit)="onSubmit($event)">
          

          <label class="mb-4 flex flex-col gap-2">
            <span class="text-sm font-semibold text-slate-700">Email</span>
            <input
              class="w-full rounded-lg border border-slate-200 bg-white px-4 py-4 text-[0.98rem] text-slate-900 outline-none transition focus:border-primary/50 focus:ring-4 focus:ring-primary/10"
              type="email"  [formField]="loginForm.email" placeholder="testgost@gmail.com" />
          </label>

          <label class="mb-4 flex flex-col gap-2">
            <span class="text-sm font-semibold text-slate-700">Password</span>
            <span class="password-field">
              <input
                class="w-full rounded-lg border border-slate-200 bg-white px-4 py-4 pr-12 text-[0.98rem] text-slate-900 outline-none transition focus:border-primary/50 focus:ring-4 focus:ring-primary/10"
                [type]="passwordVisible ? 'text' : 'password'"  [formField]="loginForm.password" placeholder="Gost@123" />
              <button type="button"
                class="absolute top-1/2 right-4 inline-flex h-8 w-8 -translate-y-1/2 items-center justify-center border-0 bg-transparent text-slate-400"
                (click)="passwordVisible = !passwordVisible"
                [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'">
                @if (passwordVisible) {
                <span class="material-symbols-outlined">visibility</span>
                } @else {
                <span class="material-symbols-outlined">visibility_off</span>
                }
              </button>
            </span>
          </label>

          <button type="submit"
            class="mt-4 w-full cursor-pointer text-center bg-primary hover:bg-primary/90 text-white px-4 py-4 rounded-lg font-bold transition-all shadow-lg shadow-primary/20">
            Log in
          </button>
        </form>

        
      </div>

      <div class="login-visual" aria-hidden="true">
        <div class="visual-overlay"></div>
        <!-- <div class="visual-ring visual-ring-one"></div>
        <div class="visual-ring visual-ring-two"></div>
        <div class="visual-bag">
          <div class="bag-tube"></div>
          <div class="bag-body">
            <div class="bag-window"></div>
            <div class="bag-drop"></div>
          </div>
        </div> -->

        <div class="visual-copy">
          <h2>Let's empower your Blood Bank today with BloodBank Pro.</h2>
        </div>
      </div>
    </div>
  </div>
</section>
